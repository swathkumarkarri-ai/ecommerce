server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - JwtAuthFilter

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/